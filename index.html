<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Draw on satellite maps, measure, and export KML, GeoJSON, PNG and PDF — runs entirely in your browser.">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SatMap GIS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/geoman/leaflet-geoman.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ======================= SVG icon sprite ======================= -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 18l6-12 8 6-8 6z"/><rect x="2.5" y="16.5" width="3" height="3"/><rect x="8.5" y="4.5" width="3" height="3"/><rect x="16.5" y="10.5" width="3" height="3"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M3 17c3-6 5 2 8-3s4-8 7-6 2 7-2 9"/><path d="M18 3l3 3"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M4 19l5-9 6 5 5-11"/><circle cx="4" cy="19" r="1.6"/><circle cx="9" cy="10" r="1.6"/><circle cx="15" cy="15" r="1.6"/><circle cx="20" cy="4" r="1.6"/></symbol>
    <symbol id="i-polygon" viewBox="0 0 24 24"><path d="M5 7l8-4 7 7-3 10H6z"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 12h8"/></symbol>
    <symbol id="i-marker" viewBox="0 0 24 24"><path d="M12 22s7-7 7-12a7 7 0 10-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 20L20 4M20 4h-8M20 4v8"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></symbol>
    <symbol id="i-area" viewBox="0 0 24 24"><path d="M4 8l6-4 10 5-2 11H6z" stroke-dasharray="3 2"/><path d="M9 12h6M12 9v6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l4 4v14H4V3z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M12 11v6M9 14h6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6 0 10 7 10 7a17 17 0 01-3.2 3.9M6.6 6.6A17 17 0 002 12s4 7 10 7a9.8 9.8 0 005.4-1.6M9.9 9.9a3 3 0 004.2 4.2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 017.7-1.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><rect x="9" y="9" width="6" height="6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4h12"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-8h16v8h-2"/><rect x="6" y="14" width="12" height="7"/></symbol>
    <symbol id="i-group" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/><path d="M11 7h4v4M13 17H9v-4" stroke-dasharray="2 2"/></symbol>
    <symbol id="i-brush" viewBox="0 0 24 24"><path d="M14 4l6 6-8 8-6-6z"/><path d="M6 12l-3 8 8-3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-areasel" viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="11" rx="1" stroke-dasharray="3 2.4"/><circle cx="15.5" cy="17.5" r="2.2"/><circle cx="20" cy="20" r="2.2"/><path d="M17 16l5-5M18.5 19l3-6"/></symbol>
    <symbol id="i-rotl" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></symbol>
    <symbol id="i-rotr" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
  </defs>
</svg>

<div id="app">
  <!-- ======================= Top toolbar ======================= -->
  <header id="topbar">
    <button class="icon-btn only-mobile" id="btn-left-toggle" title="Layers & objects"><svg><use href="#i-layers"/></svg></button>
    <div class="brand"><svg class="brand-mark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>SatMap</span></div>
    <input id="project-name" class="project-name" value="Untitled project" maxlength="120" title="Project name (click to rename)">
    <span id="save-state" class="save-state" title="Save status">●</span>
    <div class="tb-group">
      <button class="tb-btn hide-mobile" id="btn-new" title="New project"><svg><use href="#i-file"/></svg><span>New</span></button>
      <button class="tb-btn hide-mobile" id="btn-open" title="Open project"><svg><use href="#i-folder"/></svg><span>Open</span></button>
      <button class="tb-btn" id="btn-save" title="Save (Ctrl+S)"><svg><use href="#i-save"/></svg><span>Save</span></button>
    </div>
    <div class="tb-group">
      <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
      <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)"><svg><use href="#i-redo"/></svg></button>
    </div>
    <div class="tb-group">
      <button class="tb-btn hide-mobile" id="btn-import" title="Import KML, KMZ, GeoJSON, Shapefile, CSV, AutoCAD DXF/DWG or a picture"><svg><use href="#i-upload"/></svg><span>Import</span></button>
      <button class="tb-btn primary" id="btn-export-kml" title="Export KML for Google Earth"><svg><use href="#i-download"/></svg><span>Export KML</span></button>
      <div class="dropdown">
        <button class="tb-btn hide-mobile" id="btn-export-more" title="More export formats"><svg><use href="#i-print"/></svg><span>Export</span><svg class="caret"><use href="#i-down"/></svg></button>
        <div class="menu" id="export-menu">
          <button data-export="kml"><svg><use href="#i-download"/></svg>KML (Google Earth)…</button>
          <button data-export="kmz"><svg><use href="#i-download"/></svg>KMZ (compressed)…</button>
          <button data-export="geojson"><svg><use href="#i-download"/></svg>GeoJSON…</button>
          <button data-export="shp"><svg><use href="#i-download"/></svg>Shapefile (.zip)…</button>
          <hr>
          <button data-export="png"><svg><use href="#i-print"/></svg>Map image (PNG)…</button>
          <button data-export="pdf"><svg><use href="#i-print"/></svg>Print map (PDF)…</button>
          <hr>
          <button data-export="project"><svg><use href="#i-save"/></svg>Project backup (.satmap.json)</button>
        </div>
      </div>
    </div>
    <div class="dropdown only-mobile">
      <button class="icon-btn" id="btn-mobile-more" title="More"><svg><use href="#i-menu"/></svg></button>
      <div class="menu right" id="mobile-menu">
        <button data-proxy="btn-new"><svg><use href="#i-file"/></svg>New project</button>
        <button data-proxy="btn-open"><svg><use href="#i-folder"/></svg>Open project</button>
        <button data-proxy="btn-import"><svg><use href="#i-upload"/></svg>Import file / picture / CAD</button>
        <hr>
        <button data-proxy-export="kml"><svg><use href="#i-download"/></svg>Export KML / KMZ / GeoJSON</button>
        <button data-proxy-export="png"><svg><use href="#i-print"/></svg>Map image (PNG)</button>
        <button data-proxy-export="pdf"><svg><use href="#i-print"/></svg>Print map (PDF)</button>
        <hr>
        <button data-proxy="btn-goto"><svg><use href="#i-target"/></svg>Go to coordinates</button>
        <button data-proxy="btn-settings"><svg><use href="#i-settings"/></svg>Settings</button>
      </div>
    </div>
    <div class="tb-spacer"></div>
    <button class="icon-btn hide-mobile" id="btn-settings" title="Settings"><svg><use href="#i-settings"/></svg></button>
    <button class="icon-btn" id="btn-right-toggle" title="Show/hide properties panel"><svg><use href="#i-panel"/></svg></button>
  </header>

  <main id="workspace">
    <!-- ======================= Left sidebar ======================= -->
    <aside id="left-panel" class="panel side left">
      <div class="search-box">
        <svg><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Search place, lat,lng or object…" autocomplete="off">
        <div id="search-results" class="search-results"></div>
      </div>

      <section class="sect">
        <div class="sect-head">
          <h3>Layers</h3>
          <button class="mini-btn" id="btn-add-layer" title="Add layer"><svg><use href="#i-plus"/></svg>Layer</button>
        </div>
        <ul id="layer-list" class="layer-list"></ul>
      </section>

      <section class="sect" id="overlay-sect">
        <div class="sect-head">
          <h3>Pictures &amp; plans</h3>
          <button class="mini-btn" id="btn-add-overlay" title="Add a picture, screenshot, site plan, AutoCAD drawing or Shapefile"><svg><use href="#i-plus"/></svg>Add</button>
        </div>
        <ul id="overlay-list" class="object-list overlay-list"></ul>
      </section>

      <section class="sect grow">
        <div class="sect-head">
          <h3>Objects</h3>
          <label class="tiny-check"><input type="checkbox" id="objects-all-layers"> all layers</label>
        </div>
        <input id="object-filter" class="filter" type="search" placeholder="Filter objects…">
        <ul id="object-list" class="object-list"></ul>
      </section>
    </aside>

    <!-- ======================= Map ======================= -->
    <section id="map-wrap">
      <div id="map"></div>

      <!-- floating drawing toolbar -->
      <nav id="toolbar" class="floating-toolbar" aria-label="Drawing tools">
        <button data-tool="select" title="Select (V) — click objects, Shift+click / Shift+drag for multiple"><svg><use href="#i-select"/></svg></button>
        <button data-tool="move" title="Move (G) — drag selected objects"><svg><use href="#i-move"/></svg></button>
        <button data-tool="edit" title="Edit vertices (E) — drag vertices, click midpoints to insert, right-click a vertex to delete"><svg><use href="#i-edit"/></svg></button>
        <span class="sep"></span>
        <button data-tool="freehand" title="Freehand pen (F)"><svg><use href="#i-pen"/></svg></button>
        <button data-tool="polyline" title="Polyline (L)"><svg><use href="#i-line"/></svg></button>
        <button data-tool="polygon" title="Polygon (P)"><svg><use href="#i-polygon"/></svg></button>
        <button data-tool="rectangle" title="Rectangle (R)"><svg><use href="#i-rect"/></svg></button>
        <button data-tool="circle" title="Circle (C)"><svg><use href="#i-circle"/></svg></button>
        <button data-tool="marker" title="Marker (M)"><svg><use href="#i-marker"/></svg></button>
        <button data-tool="text" title="Text label (T)"><svg><use href="#i-text"/></svg></button>
        <button data-tool="arrow" title="Arrow (A)"><svg><use href="#i-arrow"/></svg></button>
        <span class="sep"></span>
        <button data-tool="measure" title="Measure distance (D)"><svg><use href="#i-ruler"/></svg></button>
        <button data-tool="measure-area" title="Measure area (Shift+D)"><svg><use href="#i-area"/></svg></button>
        <button data-tool="area" title="Select area (S) — drag a box or lasso around objects, then delete, cut out or keep only that area"><svg><use href="#i-areasel"/></svg></button>
        <button data-tool="delete" title="Delete (X) — click objects to delete"><svg><use href="#i-trash"/></svg></button>
      </nav>

      <!-- drawing hint / action bar -->
      <div id="hintbar" class="hintbar hidden">
        <span id="hint-text"></span>
        <span id="hint-extra"></span>
        <button class="mini-btn" id="hint-undo">Undo point</button>
        <button class="mini-btn primary" id="hint-finish">Finish</button>
        <button class="mini-btn" id="hint-cancel">Cancel</button>
      </div>

      <!-- map controls (top right) -->
      <div id="map-controls" class="map-controls">
        <div class="dropdown basemap-dd">
          <button class="ctl-btn" id="btn-basemap" title="Base map"><svg><use href="#i-layers"/></svg><span id="basemap-label">Satellite</span></button>
          <div class="menu right" id="basemap-menu"></div>
        </div>
        <button class="ctl-btn icon" id="btn-compass" title="Rotate the map ( [ and ] keys, N = north up)"><svg viewBox="0 0 24 24" id="compass-needle" style="transition:transform .15s"><path d="M12 2l4 10h-8z" fill="#e53935" stroke="none"/><path d="M12 22l-4-10h8z" fill="currentColor" stroke="none" opacity=".55"/></svg></button>
        <button class="ctl-btn icon" id="btn-goto" title="Go to coordinates"><svg><use href="#i-target"/></svg></button>
        <button class="ctl-btn icon" id="btn-fit" title="Zoom to all objects"><svg><use href="#i-fit"/></svg></button>
        <button class="ctl-btn icon" id="btn-grid" title="Coordinate grid"><svg><use href="#i-grid"/></svg></button>
        <button class="ctl-btn icon" id="btn-locate" title="My location"><svg><use href="#i-locate"/></svg></button>
        <button class="ctl-btn icon" id="btn-fullscreen" title="Full screen"><svg><use href="#i-full"/></svg></button>
      </div>

      <div id="measure-box" class="measure-box hidden"></div>
      <div id="toast-stack" class="toast-stack"></div>
    </section>

    <!-- ======================= Right sidebar ======================= -->
    <aside id="right-panel" class="panel side right">
      <div id="props"></div>
    </aside>
  </main>

  <!-- ======================= Status bar ======================= -->
  <footer id="statusbar">
    <span class="st" id="st-coords" title="Cursor position (click to switch DD / DMS)">—</span>
    <span class="st" id="st-scale" title="Approximate screen scale at 96 dpi">—</span>
    <span class="st" id="st-zoom">Zoom —</span>
    <span class="st" id="st-tool">Tool: Select</span>
    <span class="st" id="st-layer">Layer: —</span>
    <span class="st st-btn" id="st-units" title="Change measurement units">Units: —</span>
    <span class="st grow"></span>
    <span class="st" id="st-count">0 objects</span>
  </footer>
</div>

<div id="rot-pop" class="menu rot-pop">
  <div class="rot-head">Rotate map</div>
  <div class="rot-row"><input type="range" id="rot-range" min="-180" max="180" step="1" value="0"><input type="number" id="rot-input" min="-180" max="180" step="0.5" value="0"><span>°</span></div>
  <div class="rot-row">
    <button class="mini-btn" data-rot="-15" title="Turn left 15°"><svg><use href="#i-rotl"/></svg>15°</button>
    <button class="mini-btn" data-rot="-1" title="Turn left 1°">1°</button>
    <button class="mini-btn primary" data-rot="0">North up</button>
    <button class="mini-btn" data-rot="1" title="Turn right 1°">1°</button>
    <button class="mini-btn" data-rot="15" title="Turn right 15°">15°<svg><use href="#i-rotr"/></svg></button>
  </div>
  <button class="mini-btn" id="rot-align" style="width:100%;justify-content:center">Line up with selected road / boundary</button>
  <div class="menu-note" style="padding:6px 2px 0">Saved with the project. Exports can be rotated too.</div>
</div>
<div id="modal-root"></div>
<input type="file" id="file-input" accept=".kml,.kmz,.geojson,.json,.csv,.txt,.zip,.shp,.dbf,.prj,.cpg,.shx,.dxf,.dwg,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg" multiple hidden>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/geoman/leaflet-geoman.min.js"></script>
<script src="vendor/turf/turf.min.js"></script>
<script src="vendor/jspdf/jspdf.umd.min.js"></script>
<script src="vendor/fflate/fflate.min.js"></script>
<script src="vendor/proj4/proj4.js"></script>
<script src="vendor/dxf-parser/dxf-parser.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/geodesy.js"></script>
<script src="js/transform.js"></script>
<script src="js/crs.js"></script>
<script src="js/gis.js"></script>
<script src="js/shp.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/mapview.js"></script>
<script src="js/render.js"></script>
<script src="js/overlays.js"></script>
<script src="js/cad.js"></script>
<script src="js/tools.js"></script>
<script src="js/areaops.js"></script>
<script src="js/panels.js"></script>
<script src="js/props.js"></script>
<script src="js/io.js"></script>
<script src="js/print.js"></script>
<script src="js/app.js"></script>
</body>
</html>
